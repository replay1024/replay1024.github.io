<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* 防止滚动条出现 */
      background: #f0f0f0;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .tip-box {
      position: absolute;
      width: 250px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      user-select: none;
    }
  </style>
</head>
<body>

<script>
  const tips = [
    '多喝水哦~', '保持微笑呀', '每天都要元气满满',
    '记得吃水果', '保持好心情', '好好爱自己', '我想你了',
    '梦想成真', '期待下一次见面',
    '顺顺利利', '早点休息', '愿所有烦恼都消失',
    '别熬夜', '今天过得开心嘛', '天冷了，多穿衣服'
  ];

  const bgColors = [
    'lightpink', 'skyblue', 'lightgreen', 'lavender',
    'lightyellow', 'plum', 'coral', 'bisque', 'aquamarine',
    'mistyrose', 'honeydew', 'lavenderblush', 'oldlace'
  ];

  const totalBoxes = 150;

  function createTipBox() {
    const box = document.createElement('div');
    box.className = 'tip-box';

    // 随机提示语和背景色
    const tip = tips[Math.floor(Math.random() * tips.length)];
    const bg = bgColors[Math.floor(Math.random() * bgColors.length)];
    box.textContent = tip;
    box.style.backgroundColor = bg;

    // 随机位置（确保完全在视口内）
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    const x = Math.random() * (windowWidth - 250);
    const y = Math.random() * (windowHeight - 60);
    box.style.left = `${x}px`;
    box.style.top = `${y}px`;

    document.body.appendChild(box);
  }

  // 创建多个弹窗
  for (let i = 0; i < totalBoxes; i++) {
    // 使用 setTimeout 模拟快速但非阻塞的创建
    setTimeout(createTipBox, i * 60); // 每5毫秒一个
  }

  // 空格键关闭所有弹窗
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      const boxes = document.querySelectorAll('.tip-box');
      boxes.forEach(box => box.remove());
      // 可选：退出页面或提示
      alert('程序已退出！');
      // 或者直接关闭页面（部分浏览器会阻止）：
      // window.close();
    }
  });
</script>

</body>
</html>
